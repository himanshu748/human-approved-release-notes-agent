[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "human-approved-release-notes-agent"
version = "0.1.0"
description = "Traceable, zero-provider release-note drafts with an explicit human approval gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp-agent==0.2.6", "mcp==1.30.0", "pydantic==2.13.5"]

[project.scripts]
release-notes = "release_notes_agent.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff==0.16.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs/article.md", "/docs/verification.md", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/THIRD_PARTY.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
